
name: KICK KING Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'KICK_KING_Android_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -o KICK_KING_Android_Project.zip

      - name: Build AAB
        working-directory: KICK_KING_Android_Project
        run: gradle bundleRelease

      - name: Save Android Bundle
        uses: actions/upload-artifact@v4
        with:
          name: KICK-KING-AAB
          path: KICK_KING_Android_Project/app/build/outputs/bundle/release/*.aab
